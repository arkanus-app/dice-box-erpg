<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiceResultViewer v2 demo</title>
    <style>
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090b16; }
      #controls { position: fixed; z-index: 2; top: 16px; left: 16px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 32px); }
      button { padding: 8px 12px; color: white; background: #24304f; border: 1px solid #60709a; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="kinematic">Kinematic</button>
      <button id="physics">Physics</button>
      <button id="explode">Explode</button>
      <button id="reroll">Reroll</button>
      <button id="compound">Compound</button>
      <button id="penetrate">Penetrate</button>
      <button id="selection">Keep/drop</button>
      <button id="critical">Critical</button>
      <button id="vampire">Vampire V5</button>
      <button id="assimilation">Assimilação</button>
      <button id="fate">Fate 4dF</button>
      <button id="mixed">Mixed systems</button>
    </div>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
